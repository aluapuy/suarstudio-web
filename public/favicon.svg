<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Cross with flame top and waveform bars -->
  <g stroke="#C59B27" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Vertical stroke -->
    <line x1="16" y1="10" x2="16" y2="28" />
    <!-- Horizontal stroke -->
    <line x1="10" y1="18" x2="22" y2="18" />
    <!-- Flame / torch top -->
    <path d="M16 10 C16 6, 13 4, 14 2 C15 4, 16 3.5, 16 2 C16 3.5, 17 4, 18 2 C19 4, 16 6, 16 10" fill="#C59B27" stroke="none" />
  </g>
  <!-- Waveform bars flanking the cross -->
  <g fill="#C59B27" opacity="0.5">
    <rect x="5" y="16" width="2" height="6" rx="1" />
    <rect x="25" y="15" width="2" height="8" rx="1" />
    <rect x="2" y="18" width="2" height="3" rx="1" />
    <rect x="28" y="17" width="2" height="5" rx="1" />
  </g>
</svg>
